name: Fix design links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          mapping = {
              '01': 'https://www.redbubble.com/i/postcard/ANOMALY-RAW-SYSTEM-ERROR-by-ANOMALY-RAW/183462001/vk5y',
              '02': 'https://www.redbubble.com/i/t-shirt/ANOMALY-RAW-System-Error-by-ANOMALY-RAW/183462169/lrcw',
              '03': 'https://www.redbubble.com/i/t-shirt/ANOMALY-RAW-David-Disturbed-Glitch-Statue-Cyberpunk-by-ANOMALY-RAW/183461091/lrcw',
              '04': 'https://www.redbubble.com/i/photographic-print/ANOMALY-RAW-DATA-CORRUPTED-by-ANOMALY-RAW/183462311/zltf',
              '05': 'https://www.redbubble.com/i/poster/ANOMALY-RAW-BUTTERFLY-ERROR-by-ANOMALY-RAW/183462603/flk2',
          }
          import re
          for unit, url in mapping.items():
              pattern = rf'(<a class="card design" data-design="{unit}"[^>]*?href=")[^"]+("[^>]*>)'
              s, n = re.subn(pattern, rf'\g<1>{url}\g<2>', s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update Unit {unit}: matches={n}')
          p.write_text(s)
          PY
      - name: Verify mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          expected = {
              '01': '183462001',
              '02': '183462169',
              '03': '183461091',
              '04': '183462311',
              '05': '183462603',
          }
          for unit, rid in expected.items():
              m = re.search(rf'<a class="card design" data-design="{unit}"[^>]*href="([^"]+)"', s)
              if not m or rid not in m.group(1):
                  raise SystemExit(f'Unit {unit} mismatch: {m.group(1) if m else "missing"}')
          print('All 5 design links verified.')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-design-links.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Correct design to Redbubble product links'
          git rm .github/workflows/fix-design-links.yml
          git commit -m 'Remove one-time design link fixer'
          git push
